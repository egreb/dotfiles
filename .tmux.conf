set -g prefix C-s
unbind C-b

set -g mouse on
set -g focus-events on
set -g escape-time 0
set -g base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g allow-rename off
set -g allow-set-title off

set -g status-position top
set -g status-style "bg=#eee8d5,fg=#40565e"
set -g status-left-length 0
set -g status-right-length 64
set -g status-left ""
set -g status-right "#[fg=#40565e]#(echo #{pane_current_path} | sed \"s|^$HOME|~|\") "

setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"
setw -g window-status-format "#[fg=#40565e] #I:#W"
setw -g window-status-current-format "#[fg=#fdf6e3,bg=#40565e,bold] #I:#W "
setw -g window-status-separator ""

# Vi mode for copy/scroll
setw -g mode-keys vi

# Copy mode entry
bind Escape copy-mode
bind -T prefix Escape copy-mode

# Copy mode navigation
bind -T copy-mode-vi j send-keys -X scroll-down
bind -T copy-mode-vi k send-keys -X scroll-up
bind -T copy-mode-vi C-u send-keys -X half-page-up
bind -T copy-mode-vi C-d send-keys -X half-page-down
bind -T copy-mode-vi C-f send-keys -X page-down
bind -T copy-mode-vi C-b send-keys -X page-up
bind -T copy-mode-vi g send-keys -X history-top
bind -T copy-mode-vi G send-keys -X history-bottom
bind -T copy-mode-vi w send-keys -X next-word
bind -T copy-mode-vi b send-keys -X previous-word
bind -T copy-mode-vi / send-keys -X search-forward
bind -T copy-mode-vi ? send-keys -X search-reverse
bind -T copy-mode-vi n send-keys -X search-again
bind -T copy-mode-vi N send-keys -X search-reverse

# Copy/paste actions
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi q send-keys -X cancel

bind c new-window -c "#{pane_current_path}"
bind f popup -w 80% -h 60% -x C -y C -E "$HOME/.config/tmux/tmux-sessionizer.sh"
bind @ popup -w 100% -h 40% -x C -y 9999 -E "$HOME/.config/tmux/tmux-file-picker.sh"
bind r source-file ~/.tmux.conf
# bind w display-menu -x C -y C -T "workmux" \
#     "add" a "popup -d '#{pane_current_path}' -w 80% -h 20% -x C -y C -E '~/.config/tmux/workmux-add-branch.sh'" \
#     "add w/branch" b "popup -d '#{pane_current_path}' -w 80% -h 25% -x C -y C -E '~/.config/tmux/workmux-add-from-branch.sh'" \
#     "add w/prompt" p "popup -d '#{pane_current_path}' -w 80% -h 20% -x C -y C -E '~/.config/tmux/workmux-add-prompt.sh'" \
#     "open" o "popup -d '#{pane_current_path}' -w 80% -h 60% -x C -y C -E '~/.config/tmux/workmux-fzf.sh open'" \
#     "remove" r "popup -d '#{pane_current_path}' -w 80% -h 60% -x C -y C -E '~/.config/tmux/workmux-fzf.sh remove'" \
#     "close" c "popup -d '#{pane_current_path}' -w 80% -h 60% -x C -y C -E '~/.config/tmux/workmux-fzf.sh close'" \
#     "dashboard" d "popup -d '#{pane_current_path}' -w 90% -h 90% -x C -y C -E 'workmux dashboard'" \
#     "sidebar" s "run-shell 'workmux sidebar'" \
#     "quit" q ""
bind g popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"
bind R popup -d "#{pane_current_path}" -w 90% -h 90% -E "tuicr"

# Work notes: prefix (Ctrl-s) then Shift-n. Quit Neovim to close the popup.
bind N popup -d "#{pane_current_path}" -w 90% -h 90% -x C -y C -T "Work notes" -E '"$HOME/dotfiles/bin/notes"'

# Splits (matching neovim's prefix + v / prefix + h)
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# Cycle panes
bind n select-pane -t .+

# Pane navigation (uppercase to not clash with splits)
bind H select-pane -L
bind J select-pane -D
bind K select-pane -U
bind L select-pane -R

# Navigate without the prefix, including out of sbx's nested tmux sidecars.
# Neovim handles its own splits first through vim-tmux-navigator.
bind -n C-h if-shell -F '#{m/r:(^|/)(g?vim|nvim)(diff)?$,#{pane_current_command}}' 'send-keys C-h' 'select-pane -L'
bind -n C-l if-shell -F '#{m/r:(^|/)(g?vim|nvim)(diff)?$,#{pane_current_command}}' 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-l select-pane -R
